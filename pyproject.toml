[project]
name = "fdi_pln_2603_p4"
version = "1.0"
description = "Buscador Clásico, Semántico y RAG para El Quijote"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spacy>=3.8.11",
    "textual>=8.1.1",
    "ollama>=0.4.0",
    "rich>=13.9.4",
    "loguru>=0.7.2",
    "beautifulsoup4>=4.14.3",
    "numpy>=2.4.3",
    "es-core-news-md",
]

[project.scripts]
#Creamos el comando
fdi-pln-2603-p4 = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "data"


[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }
